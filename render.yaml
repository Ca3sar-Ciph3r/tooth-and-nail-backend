services:
  - type: web
    name: tooth-and-nail-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build && npx medusa db:migrate
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false       # paste your Neon connection string here in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: STORE_CORS
        value: https://toothandnail-v2-7aft.vercel.app
      - key: ADMIN_CORS
        sync: false       # set to your Render URL after first deploy e.g. https://tooth-and-nail-backend.onrender.com
      - key: AUTH_CORS
        sync: false       # same as ADMIN_CORS + store URL
      - key: MEDUSA_BACKEND_URL
        sync: false       # your Render URL e.g. https://tooth-and-nail-backend.onrender.com
